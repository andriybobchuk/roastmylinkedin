# Netlify config for Roast My LinkedIn.
#
# Uses background function + polling (Free-tier compatible: avoids the 10s sync timeout).
#
# Env vars to set in Netlify UI (Site → Environment variables):
#   APIFY_TOKEN
#   GEMINI_API_KEY   (or ANTHROPIC_API_KEY to prefer Claude)
# Optional:
#   GEMINI_MODEL     (default gemini-3.6-flash)
#   CLAUDE_MODEL     (default claude-sonnet-4-6)

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# POST /analyze → kick off the background audit function.
# Netlify returns 202 immediately, function runs up to 15 min.
[[redirects]]
  from = "/analyze"
  to = "/.netlify/functions/analyze-background"
  status = 200
  force = true

# GET /analyze-status?id=X → read current job state from Blobs.
[[redirects]]
  from = "/analyze-status"
  to = "/.netlify/functions/analyze-status"
  status = 200
  force = true

# POST /stripe-webhook → Stripe fulfillment webhook.
[[redirects]]
  from = "/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

# GET /session-recipe?session_id=cs_... → success.html polls this to fetch
# the recipe token as soon as the webhook has finished processing.
[[redirects]]
  from = "/session-recipe"
  to = "/.netlify/functions/session-recipe"
  status = 200
  force = true

# GET /recipe/<token> → serves the customer's unlocked Recipe.
[[redirects]]
  from = "/recipe/*"
  to = "/.netlify/functions/serve-recipe/:splat"
  status = 200
  force = true

# Fallback for unknown routes — serve landing page with 404 status code.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Baseline security + crawler headers. Netlify still emits `server: Netlify`
# and `x-nf-request-id` which cannot be suppressed without a proxy tier.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-image-preview:large, max-snippet:-1"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-Frame-Options = "DENY"

# Serve the AI-crawler surfaces with the correct MIME type so LLM bots
# understand they're getting machine-readable content.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=600"
