<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Roast My LinkedIn — Your LinkedIn is boring.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17130F"/>
      <stop offset="1" stop-color="#0B0806"/>
    </linearGradient>
    <linearGradient id="amberFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4A574" stop-opacity="0"/>
      <stop offset="1" stop-color="#D4A574" stop-opacity=".28"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Amber accent edge -->
  <rect x="0" y="0" width="12" height="630" fill="#D4A574"/>

  <!-- Tilted brand chip, top-left -->
  <g transform="translate(72 88) rotate(-3)">
    <rect x="0" y="0" width="330" height="54" fill="#080605"/>
    <text x="18" y="37" fill="#F1EBDF" font-family="'SF Pro Display', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="900" font-size="26" letter-spacing="-0.3">
      RoastMy<tspan fill="#D4A574">LinkedIn</tspan>
    </text>
  </g>

  <!-- Big headline -->
  <text x="72" y="330" fill="#F1EBDF" font-family="'SF Pro Display', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="900" font-size="120" letter-spacing="-4">Your LinkedIn</text>
  <text x="72" y="458" fill="#F1EBDF" font-family="'SF Pro Display', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="900" font-size="120" letter-spacing="-4">is <tspan fill="#D4A574">boring</tspan>.</text>

  <!-- Tag row -->
  <g transform="translate(72 502)">
    <rect x="0" y="0" width="8" height="8" fill="#D4A574"/>
    <text x="22" y="9" fill="#F1EBDF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="18" letter-spacing="2">
      FREE 0&#8211;100 PROFILE SCORE
    </text>
    <rect x="330" y="0" width="8" height="8" fill="#D4A574"/>
    <text x="352" y="9" fill="#F1EBDF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="18" letter-spacing="2">
      SSI REPLACEMENT
    </text>
    <rect x="602" y="0" width="8" height="8" fill="#D4A574"/>
    <text x="624" y="9" fill="#F1EBDF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="18" letter-spacing="2">
      FOR ENGINEERS
    </text>
  </g>

  <!-- URL bottom-right -->
  <text x="1128" y="580" text-anchor="end" fill="#D4A574" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-weight="800" font-size="22" letter-spacing="2">
    ROASTMYLINKEDIN.NET
  </text>
</svg>
